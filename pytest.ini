[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests/test_*.py
python_classes = *Test
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    --color=yes
markers =
    unit: Tests unitarios puros (sin base de datos)
    integration: Tests de integración (con base de datos)
    webhook: Tests del webhook de Twilio
    celery: Tests de tareas Celery
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
