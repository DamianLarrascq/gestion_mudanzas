[pytest]
DJANGO_SETTINGS_MODULE = config.settings

# Los archivos de tests siguen la convención Django: tests.py por app.
python_files = tests.py test_*.py
python_classes = *Tests *Test
python_functions = test_*

# tests_actions/ tiene su propia configuración y estructura de imports distinta.
# Se excluye para evitar errores de recolección desde el pytest raíz.
norecursedirs = tests_actions .git __pycache__ .venv

addopts =
    -v
    --tb=short
    --no-header
    --color=yes

markers =
    unit: Tests unitarios puros (sin base de datos)
    integration: Tests de integración (con base de datos)
    webhook: Tests del webhook de Twilio
    celery: Tests de tareas Celery

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
