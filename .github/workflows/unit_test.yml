name: Unit Tests — SGM

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "ci-only-secret-key-not-for-production"
      DEBUG: "True"
      DB_ENGINE: "sqlite"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      MERCADOPAGO_ACCESS_TOKEN: "TEST_TOKEN_CI"
      SITE_BASE_URL: "http://localhost:8000"
      MERCADOPAGO_SANDBOX: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar migraciones
        run: python manage.py migrate --run-syncdb

      - name: Ejecutar tests unitarios
        run: |
          python manage.py test gestion notificaciones webhook public \
            --verbosity=2 \
            --failfast

      - name: Reporte de cobertura
        run: |
          pip install coverage
          coverage run manage.py test gestion notificaciones webhook public
          coverage report --fail-under=60
          coverage xml -o coverage.xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
