name: Tests SGM

on:
  push:
    branches: [ main, develop, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: "ci-secret-key-insecure-only-for-github-actions"
  DEBUG: "True"
  DB_ENGINE: "sqlite"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CELERY_BROKER_URL: "redis://localhost:6379/0"
  CELERY_TASK_ALWAYS_EAGER: "True"

jobs:
  test:
    name: Tests y Cobertura
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verificar Python >= 3.12
        run: python -c "import sys; assert sys.version_info >= (3,12), f'Necesario >=3.12, hay {sys.version}'"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Normalizar requirements.txt de UTF-16 a UTF-8
        run: python scripts/decode_requirements.py

      - name: Instalar dependencias
        run: pip install -r requirements_utf8.txt

      - name: Instalar herramientas de test
        run: pip install pytest pytest-django pytest-cov coverage

      - name: Verificar Redis
        run: python -c "import redis; r=redis.Redis(host='localhost',port=6379); assert r.ping(); print('Redis OK')"

      - name: Migraciones
        run: python manage.py migrate --no-input

      - name: Django check
        run: python manage.py check --no-input

      - name: Tests - Modelos
        run: |
          mkdir -p reports
          python -m pytest tests/test_models.py -v --tb=short --junitxml=reports/junit-models.xml --cov=gestion --cov-report=xml:reports/coverage-models.xml

      - name: Tests - Admin
        run: python -m pytest tests/test_admin.py -v --tb=short --junitxml=reports/junit-admin.xml --cov=gestion --cov-append --cov-report=xml:reports/coverage-admin.xml

      - name: Tests - Celery y Settings
        run: python -m pytest tests/test_celery.py -v --tb=short --junitxml=reports/junit-celery.xml --cov=config --cov-append --cov-report=xml:reports/coverage-celery.xml

      - name: Cobertura total
        run: python -m pytest tests/ --cov=gestion --cov=config --cov-report=term-missing --cov-report=xml:reports/coverage-total.xml --cov-fail-under=50
        continue-on-error: true

      - name: Subir reportes
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  django-checks:
    name: Django Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Normalizar requirements.txt
        run: python scripts/decode_requirements.py

      - name: Instalar dependencias
        run: pip install -r requirements_utf8.txt

      - name: Django check
        run: python manage.py check --no-input

      - name: Verificar migraciones al dia
        run: python manage.py migrate --check --no-input
        continue-on-error: true
        continue-on-error: true
