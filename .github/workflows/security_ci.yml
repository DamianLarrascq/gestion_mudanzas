name: Security — Tests + CodeQL

on:
  push:
    branches: [ main, develop, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Análisis CodeQL semanal — domingos a las 03:00 UTC
    - cron: "0 3 * * 0"

env:
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: "ci-security-secret-key-only-for-github-actions-not-for-prod"
  DEBUG: "True"
  DB_ENGINE: "sqlite"
  ALLOWED_HOSTS: "scruz.pythonanywhere.com,localhost,127.0.0.1"
  CELERY_BROKER_URL: "redis://localhost:6379/0"
  CELERY_TASK_ALWAYS_EAGER: "True"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Tests de seguridad
  # ────────────────────────────────────────────────────────────────────────────
  security-tests:
    name: Tests de Seguridad (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12" ]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov coverage

      - name: ✅ Verificar Redis
        run: |
          python3 -c "import redis; r = redis.Redis(host='localhost', port=6379, socket_connect_timeout=5); r.ping(); print('Redis OK')" 

      - name: 🗄️ Ejecutar migraciones
        run: python manage.py migrate --no-input

      - name: 🔍 Django system check
        run: python manage.py check

      - name: 👤 Crear usuarios de prueba de seguridad
        run: |
          python manage.py shell -c "
          from django.contrib.auth.models import User

          # admin / admin123 — staff, acceso al panel
          u, created = User.objects.get_or_create(username='admin')
          u.set_password('admin123')
          u.is_staff = True
          u.is_superuser = True
          u.save()
          print(f'  admin: {\"creado\" if created else \"actualizado\"}')

          # admin_sec / securepass123 — staff, tests de seguridad
          u, created = User.objects.get_or_create(username='admin_sec')
          u.set_password('securepass123')
          u.is_staff = True
          u.is_superuser = True
          u.save()
          print(f'  admin_sec: {\"creado\" if created else \"actualizado\"}')

          # nostaff / pass123 — sin is_staff, bloqueado del admin
          u, created = User.objects.get_or_create(username='nostaff')
          u.set_password('pass123')
          u.is_staff = False
          u.is_superuser = False
          u.save()
          print(f'  nostaff: {\"creado\" if created else \"actualizado\"}')

          # sistema — usuario interno para webhooks
          u, created = User.objects.get_or_create(username='sistema')
          u.is_active = False
          u.save()
          print(f'  sistema: {\"creado\" if created else \"actualizado\"}')
          "

      # ── Step: tests generales de seguridad ───────────────────────────────
      - name: 🔐 Ejecutar tests de seguridad — auth, CSRF, webhook, presupuesto, headers
        run: |
          mkdir -p reports
          python -m pytest tests/security/test_auth.py \
            -v --tb=short \
            --junitxml=reports/junit-security.xml \
            --cov=gestion --cov=webhook --cov=public \
            --cov-report=xml:reports/coverage-security.xml \
            --cov-report=term-missing \
            -m "not slow"

      # ── Step: tests IDOR ─────────────────────────────────────────────────
      # Estos tests documentan una vulnerabilidad activa (IDOR en
      # ClienteDetailView y ResumenMudanzaView) y están diseñados para
      # FALLAR hasta que se implemente el ownership check.
      # continue-on-error: true evita que bloqueen el pipeline durante ese
      # período. Cuando la corrección se mergee, quitar continue-on-error.
      - name: 🔍 Ejecutar tests de seguridad — IDOR
        continue-on-error: true
        run: |
          python -m pytest tests/security/test_idor.py \
            -v --tb=short \
            --junitxml=reports/junit-security-idor.xml \
            --cov=gestion --cov-append \
            --cov-report=xml:reports/coverage-security.xml \
            --cov-report=term-missing

      # ── Step: tests SQLI + Webhook Spoofing ─────────────────────────────
      # SPOOF-01/02: los tests que documentan la falta de X-Signature están
      # diseñados para FALLAR hasta que se implemente la validación de firma.
      # continue-on-error: true evita que bloqueen el pipeline mientras tanto.
      # Cuando la firma esté implementada, quitar continue-on-error.
      # SQLI-01: estos tests DEBEN pasar siempre (ORM parametriza las queries).
      - name: 🛡️ Ejecutar tests de seguridad — SQL Injection + Webhook Spoofing
        continue-on-error: true
        run: |
          python -m pytest tests/security/test_sqli_webhook.py \
            -v --tb=short \
            --junitxml=reports/junit-security-sqli-webhook.xml \
            --cov=gestion --cov=webhook --cov=public --cov-append \
            --cov-report=xml:reports/coverage-security.xml \
            --cov-report=term-missing

      # ── Step: tests presupuesto ──────────────────────────────────────────
      - name: 🧮 Ejecutar tests de seguridad — Presupuesto público
        run: |
          python -m pytest tests/security/test_presupuesto.py \
            -v --tb=short \
            --junitxml=reports/junit-security-presupuesto.xml \
            --cov=public --cov-append \
            --cov-report=xml:reports/coverage-security.xml \
            --cov-report=term-missing

      # ── Steps: resumen de colección ──────────────────────────────────────
      - name: 📊 Resumen — tests de seguridad generales
        if: always()
        run: |
          echo "── SEC: auth / CSRF / webhook / presupuesto / headers ──"
          python -m pytest tests/security/test_auth.py \
            --tb=no --no-header --co -q 2>/dev/null \
            | grep "::" | sed 's/^/  /' || true

      - name: 📊 Resumen — tests IDOR (vulnerabilidad documentada, falla esperada)
        if: always()
        run: |
          echo "── IDOR: ClienteDetailView / ResumenMudanzaView ──"
          python -m pytest tests/security/test_idor.py \
            --tb=no --no-header --co -q 2>/dev/null \
            | grep "::" | sed 's/^/  /' || true

      - name: 📊 Resumen — tests SQL Injection + Webhook Spoofing
        if: always()
        run: |
          echo "── SQLI + SPOOF: inyección SQL y payload falso MP ──"
          python -m pytest tests/security/test_sqli_webhook.py \
            --tb=no --no-header --co -q 2>/dev/null \
            | grep "::" | sed 's/^/  /' || true

      - name: 📊 Resumen — tests presupuesto público
        if: always()
        run: |
          echo "── PRESUPUESTO: endpoint público /presupuesto/solicitar/ ──"
          python -m pytest tests/security/test_presupuesto.py \
            --tb=no --no-header --co -q 2>/dev/null \
            | grep "::" | sed 's/^/  /' || true

      - name: 📤 Subir reportes de seguridad
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: security-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: CodeQL — Análisis estático de seguridad
  # ────────────────────────────────────────────────────────────────────────────
  codeql:
    name: 🔎 CodeQL Analysis
    runs-on: ubuntu-latest
    # Permisos mínimos requeridos por CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ python ]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2

      - name: 🔎 Inicializar CodeQL
        uses: github/codeql-action/init@v3.28.16
        with:
          languages: ${{ matrix.language }}
          # Consultas de seguridad extendidas — incluye CWE-022, CWE-078,
          # CWE-089 (SQLi), CWE-094, CWE-116 y más.
          queries: security-extended

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar dependencias (para análisis de imports)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏗️ Autobuild (CodeQL rastrea imports y flujo)
        uses: github/codeql-action/autobuild@v3.28.16

      - name: 📤 Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v3.28.16
        with:
          category: "/language:${{ matrix.language }}"
          # Los resultados quedan en la pestaña "Security" → "Code scanning alerts"
          upload: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Verificación de dependencias con pip-audit
  # ────────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: 📦 Auditoría de Dependencias
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar dependencias y pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt

      - name: 🔍 Auditar vulnerabilidades conocidas (CVEs)
        run: |
          mkdir -p reports
          pip-audit \
            --requirement requirements.txt \
            --format=json \
            --output=reports/pip-audit.json \
            --desc || true
          # '--desc' muestra descripción de cada CVE
          # '|| true' evita que falle el workflow en vulnerabilidades de baja severidad;
          # revisar el artefacto manualmente o ajustar según política del equipo.

      - name: 📋 Mostrar resumen de auditoría
        if: always()
        run: |
          pip-audit \
            --requirement requirements.txt \
            --desc 2>&1 | tail -30 || true

      - name: 📤 Subir reporte de auditoría
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: dependency-audit-report
          path: reports/pip-audit.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Django deployment checklist (producción)
  # ────────────────────────────────────────────────────────────────────────────
  django-security-check:
    name: ✅ Django Security Checklist
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Migraciones
        run: python manage.py migrate --no-input

      - name: 🔍 Django system check (con checks de deploy)
        # manage.py check --deploy evalúa configuraciones de producción:
        # HSTS, SECURE_COOKIES, DEBUG=False, etc.
        # continue-on-error: true porque en CI el entorno es dev (DEBUG=True).
        # En el pipeline de producción esto debe fallar el build.
        run: |
          mkdir -p reports
          python manage.py check --deploy 2>&1 | tee reports/django-deploy-check.txt || true

      - name: 📋 Mostrar advertencias de seguridad de Django
        if: always()
        run: cat reports/django-deploy-check.txt || true

      - name: 📤 Subir reporte de deploy check
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: django-security-check
          path: reports/django-deploy-check.txt
          retention-days: 30