name: 🧪 CI — Tests SGM

on:
  push:
    branches: [ main, develop, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

env:
  python-version: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: "ci-secret-key-insecure-only-for-github-actions"
  DEBUG: "True"
  DB_ENGINE: "sqlite"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CELERY_BROKER_URL: "redis://localhost:6379/0"
  CELERY_TASK_ALWAYS_EAGER: "True"

jobs:
  # ──────────────────────────────────────────────────────
  # JOB 1: Tests unitarios e integración
  # ──────────────────────────────────────────────────────
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # requirements.txt tiene encoding UTF-16 — normalizar antes de instalar
          python -c "
          with open('requirements.txt', 'rb') as f:
              raw = f.read()
          with open('requirements_clean.txt', 'w', encoding='utf-8') as f:
              f.write(raw.decode('utf-16'))
          "
          pip install -r requirements_clean.txt
          pip install pytest pytest-django pytest-cov coverage

      - name: ✅ Verificar Redis
        run: redis-cli -h localhost ping

      - name: 🗄️ Ejecutar migraciones
        run: python manage.py migrate --no-input

      - name: 🔍 Django check
        run: python manage.py check --no-input

      - name: 🧪 Tests — Modelos
        run: |
          python -m pytest tests/test_models.py \
            -v --tb=short \
            --junitxml=reports/junit-models.xml \
            --cov=gestion --cov-report=xml:reports/coverage-models.xml

      - name: 🧪 Tests — Admin y Formularios
        run: |
          python -m pytest tests/test_admin.py \
            -v --tb=short \
            --junitxml=reports/junit-admin.xml \
            --cov=gestion --cov-append --cov-report=xml:reports/coverage-admin.xml

      - name: 🧪 Tests — Celery y Settings
        run: |
          python -m pytest tests/test_celery.py \
            -v --tb=short \
            --junitxml=reports/junit-celery.xml \
            --cov=config --cov-append --cov-report=xml:reports/coverage-celery.xml

      - name: 📊 Reporte de cobertura total
        run: |
          python -m pytest tests/ \
            --cov=gestion --cov=config \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-total.xml \
            --cov-report=html:coverage-html \
            --cov-fail-under=50
        continue-on-error: true

      - name: 📤 Subir reportes como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # JOB 2: Verificaciones de Django
  # ──────────────────────────────────────────────────────
  django-checks:
    name: ✅ Django Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          python -c "
          with open('requirements.txt', 'rb') as f:
              raw = f.read()
          with open('requirements_clean.txt', 'w') as f:
              f.write(raw.decode('utf-16'))
          "
          pip install -r requirements_clean.txt

      - name: 🔍 manage.py check
        run: python manage.py check --no-input

      - name: 📋 Verificar migraciones al día
        run: python manage.py migrate --check --no-input
        continue-on-error: true
