[pytest]
DJANGO_SETTINGS_MODULE = config.settings

python_files  = test_*.py
python_classes = *Test *Tests
python_functions = test_*

testpaths = tests

addopts =
    -v
    --tb=short
    --no-header
    --color=yes

markers =
    security:     Tests de seguridad (auth, CSRF, IDOR, SQLi, spoofing)
    integration:  Tests de integración con DB y servicios externos mockeados
    e2e:          Tests end-to-end con Selenium
    slow:         Tests que tardan más de 2 segundos
    xfail_vuln:   Tests que documentan vulnerabilidades activas (se espera que fallen)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
